[project]
name = "blindaje-ml"
version = "0.1.0"
description = "Contenedor de ML de Blindaje: ffmpeg, huella de voz, embeddings, FAISS, grafo, PDF y autenticidad"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "faiss-cpu>=1.9",
  "networkx>=3.3",
  "pillow>=10.4",
  "imagehash>=4.3",
  "jinja2>=3.1",
  "weasyprint>=63",
  # Credenciales de contenido C2PA (MIT o Apache-2.0). 0.38.0: la última con ruedas para Linux y Windows.
  "c2pa-python==0.38.0",
]

[project.optional-dependencies]
# Modelos reales. La imagen de Docker los instala; CI corre sin ellos (tests livianos).
models = [
  "torch==2.11.*",  # mismo minor que torchaudio (su extensión nativa depende de la ABI de torch)
  "torchaudio==2.11.*",
  "speechbrain>=1.0.3",
  "transformers>=4.46",
  "sentencepiece>=0.2",
  "huggingface-hub>=0.26",
  "audioseal==0.2.0",  # detector de marcas de agua de audio de Meta (MIT, código y pesos)
]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.uv]
package = true
# Sin esto uv reutiliza la rueda cacheada del paquete aunque cambien los .py o las plantillas.
cache-keys = [{ file = "pyproject.toml" }, { file = "blindaje_ml/**/*" }]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blindaje_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "heavy: usa los modelos reales (SpeechBrain, e5, DINOv2); requiere el extra models y los pesos en ML_MODELS_DIR",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
